<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Video Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 2rem;
            font-size: 2.5em;
        }

        .input-group {
            position: relative;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s ease;
            padding-right: 120px;
        }

        input:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
        }

        button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #45b7b0;
            transform: translateY(-50%) scale(1.05);
        }

        .loading {
            display: none;
            margin: 2rem 0;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 2rem;
        }

        .thumbnail {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            margin: 1rem 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .video-info {
            text-align: left;
            margin: 1rem 0;
        }

        .download-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
        }

        .download-btn {
            background: #ff6b6b;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            min-height: 60px;
            word-break: break-word;
            white-space: normal;
        }

        .download-btn:hover {
            background: #ff5252;
            transform: translateY(-3px);
        }

        .error {
            color: #ff4757;
            margin: 1rem 0;
            min-height: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            
            button {
                position: static;
                transform: none;
                width: 100%;
                margin-top: 1rem;
            }
            
            input {
                padding-right: 1rem;
            }
            
            .download-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fab fa-youtube"></i> YouTube Downloader</h1>
        <div class="input-group">
            <input type="url" id="url" placeholder="Paste YouTube URL here...">
            <button onclick="processUrl()">Download</button>
        </div>
        <div class="loading">
            <div class="loader"></div>
        </div>
        <div class="error" id="error"></div>
        <div class="result" id="result">
            <img class="thumbnail" id="thumbnail" src="" alt="Video Thumbnail">
            <div class="video-info">
                <h2 id="title"></h2>
            </div>
            <div class="download-options" id="downloadOptions"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
